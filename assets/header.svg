<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Clayton Alves</title>
  <desc id="desc">Banco de Dados, DevOps &amp; Cloud, Desenvolvimento Back-end. Em busca da primeira oportunidade como Jovem Aprendiz ou Trainee em TI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .label { font: 500 18px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #8b949e; letter-spacing: 1px; }
    .name { font: 700 64px "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; fill: #f0f6fc; letter-spacing: 1px; }
    .areas { font: 500 22px "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
    .status { font: 500 17px "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
    .dot { fill: #58a6ff; }
  </style>

  <rect width="1200" height="310" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="310" rx="16" fill="url(#grid)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1199" height="309" rx="16" fill="none" stroke="#30363d"/>

  <text x="600" y="78" text-anchor="middle" class="label">~/Claytonasantos</text>
  <text x="600" y="146" text-anchor="middle" class="name">Clayton Alves</text>
  <rect x="420" y="166" width="360" height="2" fill="url(#accent)"/>
  <text x="600" y="206" text-anchor="middle" class="areas">Banco de Dados <tspan class="dot">•</tspan> DevOps &amp; Cloud <tspan class="dot">•</tspan> Desenvolvimento Back-end</text>

  <rect x="290" y="234" width="620" height="40" rx="20" fill="#0d1117" stroke="#30363d"/>
  <circle cx="318" cy="254" r="5" fill="#3fb950"/>
  <text x="612" y="260" text-anchor="middle" class="status">Em busca da primeira oportunidade · Jovem Aprendiz ou Trainee em TI</text>
</svg>
