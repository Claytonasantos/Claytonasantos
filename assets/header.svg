<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Clayton Alves</title>
  <desc id="desc">Database Development, DevOps and Cloud, Back-end Development</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .label { font: 500 18px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #8b949e; letter-spacing: 1px; }
    .name { font: 700 64px "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; fill: #f0f6fc; letter-spacing: 1px; }
    .areas { font: 500 22px "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
    .dot { fill: #58a6ff; }
  </style>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#30363d"/>

  <text x="600" y="96" text-anchor="middle" class="label">~/Claytonasantos</text>
  <text x="600" y="168" text-anchor="middle" class="name">Clayton Alves</text>
  <rect x="420" y="190" width="360" height="2" fill="url(#accent)"/>
  <text x="600" y="234" text-anchor="middle" class="areas">Database Development <tspan class="dot">•</tspan> DevOps &amp; Cloud <tspan class="dot">•</tspan> Back-end Development</text>
</svg>
